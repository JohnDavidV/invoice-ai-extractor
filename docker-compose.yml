services:
  extractor:
    build: .
    ports: ["8500:8500"]
    environment:
      EXTRACTOR_OLLAMA_URL: http://ollama:11434
      EXTRACTOR_OLLAMA_MODEL: llama3.2:3b
    depends_on: [ollama]

  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama:/root/.ollama"]
    # first run: docker compose exec ollama ollama pull llama3.2:3b

volumes:
  ollama:
